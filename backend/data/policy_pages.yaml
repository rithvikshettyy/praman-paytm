# Insurer pages the "Find a policy" journey reads, per kind of insurance. Paths only: the site is the
# first host in POLICY_SEARCH_DOMAINS (backend/.env). A page that no longer loads is skipped.
# Picked from the site's own search results on 2026-10-03; not checked against any insurer.
verified_by: UNVERIFIED
kinds:
  health:
    - /health-insurance/companies/care/
    - /health-insurance/companies/niva-bupa/
    - /health-insurance/companies/star/
    - /health-insurance/companies/hdfc-ergo/
    - /health-insurance/companies/icici-lombard/
    - /health-insurance/companies/bajaj-allianz/
    - /health-insurance/companies/raheja-qbe/
  life:
    - /term-insurance/companies/lic/
    - /term-insurance/companies/tata-aia/
    - /term-insurance/companies/max/
    - /term-insurance/companies/hdfc-life/
    - /term-insurance/companies/icici-prudential/
    - /term-insurance/plans/indiafirst-term-insurance/
  motor:
    - /car-insurance/companies/hdfc-ergo/
    - /car-insurance/companies/icici-lombard/
    - /car-insurance/companies/liberty/
    - /car-insurance/companies/national/
    - /two-wheeler-insurance/companies/bajaj-allianz/
    - /two-wheeler-insurance/companies/shriram/
    - /two-wheeler-insurance/companies/acko/

# Insurer pages on the same site that are only linked to, never read: a "buy or compare" link under an
# option whose insurer is named here. A page is matched by the words of its last path part, all of which
# must appear in the insurer's name ("sbi-general" matches "SBI General Insurance"). Each loaded on 2026-10-03;
# not checked against any insurer.
links:
  - /general-insurance/companies/digit/
  - /general-insurance/companies/sbi-general/
  - /general-insurance/companies/hdfc-ergo/
  - /general-insurance/companies/bajaj-allianz/
  - /general-insurance/companies/tata-aig/

# The insurer's own site, searched to confirm a plan exists (keyword in the insurer or plan name -> domain).
# A wrong or missing domain only means the plan is shown without the "insurer's site lists it" mark.
insurers:
  care: careinsurance.com
  star health: starhealth.in
  niva bupa: nivabupa.com
  hdfc ergo: hdfcergo.com
  icici lombard: icicilombard.com
  bajaj allianz: bajajallianz.com
  bajaj general: bajajallianz.com
  raheja qbe: rahejaqbe.com
  manipalcigna: manipalcigna.com
  manipal cigna: manipalcigna.com
  lic: licindia.in
  tata aia: tataaia.com
  tata aig: tataaig.com
  max life: axismaxlife.com
  hdfc life: hdfclife.com
  icici prudential: iciciprulife.com
  indiafirst: indiafirstlife.com
  liberty: libertyinsurance.in
  national insurance: nationalinsurance.nic.co.in
  shriram: shriramgi.com
  acko: acko.com
  new india: newindia.co.in
  iffco tokio: iffcotokio.co.in
  sbi general: sbigeneral.in
